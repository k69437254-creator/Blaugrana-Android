
name: Build Blaugrana APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q Blaugrana-Android-Project.zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: Blaugrana-Android
        run: npm install

      - name: Add Android platform
        working-directory: Blaugrana-Android
        run: npx cap add android

      - name: Sync app
        working-directory: Blaugrana-Android
        run: npx cap sync android

      - name: Build APK
        working-directory: Blaugrana-Android
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blaugrana-APK
          path: Blaugrana-Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
